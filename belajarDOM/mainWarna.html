<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Main warna</title>
</head>
<style>
    html, body{
        height: 100%;
    }
    h1{
        color: #606c38;
    }
    .h1{
        color: white;
    }
    body{
        text-align: center;
    }
    .body{
        background-color: #606c38;
    }
    button{
        border-radius: 25px;
        padding: 15px;
        background-color: white;
        color: #606c38;
        font-size:medium;
        border:2px solid #606c38;
    }
    .button{
        border-radius: 25px;
        padding: 15px;
        background-color: #606c38;
        color: white;
        font-size:medium;
        border:2px solid white; 
    }
    .kotak{
        width: 25px;
        height: 25px;
        margin: 10px auto;
        border: 2px solid;
    }
    .merah{
        background-color: red;
    }
    .hijau{
        background-color: green;
    }
    .biru{
        background-color: blue;
    }
</style>
<body>
    <h1>Bermain warna untuk background halaman</h1>
    <button type="button" id="ubahWarnaBg">Ubah Warna Bg</button>
    <br><br>
    <div class="kotak merah"></div>
    <input type="range" name="sliderMerah" min="0" max="255">
    <div class="kotak hijau"></div>
    <input type="range" name="sliderhijau" min="0" max="255">
    <div class="kotak biru"></div>
    <input type="range" name="sliderbiru" min="0" max="255">


    <script src="mainWarna.js"></script>
</body>
</html>
